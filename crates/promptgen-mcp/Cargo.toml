[package]
name = "promptgen-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stateless MCP adapter for the promptGen compiler"

[dependencies]
axum = "0.8.8"
promptgen-core = { path = "../promptgen-core" }
rmcp = { version = "3.1.0", default-features = false, features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
serde_json = "1.0"
tokio = { version = "1.47.1", features = [
  "io-std",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
